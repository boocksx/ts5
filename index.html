<style>
*{
    margin:0;

    box-sizing:border-box;
}

body{
    background:#0f0f0f;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    text-align:center;
}

.container{
    padding:30px;
}

.loader{
    width:60px;
    height:60px;
    border:5px solid #333;
    border-top:5px solid #229ED9;
    border-radius:50%;
    animation:spin 1s linear infinite;
    margin:0 auto 25px;
}

@keyframes spin{
    100%{transform:rotate(360deg);}
}

h1{
    margin-bottom:15px;
}

p{
    color:#bbb;
    margin-bottom:25px;
}

.button{
    display:inline-block;
    background:#229ED9;
    color:#fff;
    text-decoration:none;
    padding:15px 35px;
    border-radius:10px;
    font-weight:bold;
}
